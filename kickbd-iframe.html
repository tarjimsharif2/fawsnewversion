        function AlbaPlayerControl(encodedUrl, playerType = 'clappr') {
            const decodedUrl =  (encodedUrl);
            if(playerType === 'iframe') {
                jQuery('.video-con').show();
                jQuery('.post-video').hide();
                //myvideo
                jQuery('.myvideo').hide();
                jQuery('.myvideo').html(`<video class="post-video" controls style="display: none;"></video>`);
                // stop video plyr
                if(window.hls) {
                    window.hls.destroy();
                }
                jQuery('.video-con').html(`<iframe class="videoif" src="${decodedUrl}" allowfullscreen="" frameborder="0" height="100%" width="100%"></iframe>`);
                
                     }
            if(playerType === 'm3u8') {
                //remove the iframe src and hide
                document.querySelector('.video-con').innerHTML = '';
                jQuery('.video-con').hide();
                jQuery('.post-video').show();
                
                jQuery('.myvideo').show()

                const videoElement = document.querySelector('video');
                if (Hls.isSupported()) {
                    const hlsInstance = new Hls();
                    hlsInstance.loadSource(decodedUrl);
                    hlsInstance.attachMedia(videoElement);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                        new Plyr(videoElement,{
                            autoplay: true,
                        });
                    });
                    window.hls = hlsInstance;
                } else {
                    new Plyr(videoElement, { 
  autoplay: true, 
})
                }
                //show the video
                videoElement.style.display = 'block';

            }

}
