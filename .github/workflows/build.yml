name: Build and Zip Dist

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Zip for cPanel Node.js App
        run: |
          zip -r dist.zip dist package.json app.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist.zip
